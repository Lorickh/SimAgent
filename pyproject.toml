[project]
name = "simagent"
version = "0.1.0"
description = "Local agentic AI with repo reading and lightweight RAG"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
simagent = "simagent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
